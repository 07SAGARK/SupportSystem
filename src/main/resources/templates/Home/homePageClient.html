<!doctype html>
<html lang="en" class="h-full" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Portal - Support Tickets</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/_sdk/element_sdk.js"></script>
    <script src="/_sdk/data_sdk.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet">
    <style>
    body {
      box-sizing: border-box;
    }
    * {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
    .ticket-card {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .ticket-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
    }
    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .animate-slide-up {
      animation: slideUp 0.5s ease-out forwards;
    }
    .modal-backdrop {
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
    }
    @keyframes pulse-glow {
      0%, 100% {
        box-shadow: 0 0 20px rgba(99, 102, 241, 0.4);
      }
      50% {
        box-shadow: 0 0 30px rgba(99, 102, 241, 0.6);
      }
    }
    .pulse-glow {
      animation: pulse-glow 2s ease-in-out infinite;
    }
     .main-div {
        display: flex;
        justify-content: space-between;
      }
      .first-div {
        margin-right: 10px;
      }

      .disabled-link {
        pointer-events: none;
        opacity: 0.5;
        cursor: not-allowed;
      }
  </style>
    <style>@view-transition { navigation: auto; }</style>
</head>
<body class="h-full w-full overflow-auto" style="margin: 0; padding: 0;">
<div id="app" class="min-h-full w-full bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900"><!-- Client Navbar -->
    <nav class="bg-slate-900/80 backdrop-blur-xl shadow-2xl sticky top-0 z-50 border-b border-indigo-500/20">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-20">
                <div class="flex items-center gap-4">
                    <div class="relative">
                        <div class="w-12 h-12 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-2xl flex items-center justify-center shadow-xl pulse-glow">
                            <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 110 4v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 110-4V7a2 2 0 00-2-2H5z" />
                            </svg>
                        </div>
                    </div>
                    <div><span id="company-name" class="text-2xl font-bold bg-gradient-to-r from-indigo-400 to-purple-400 bg-clip-text text-transparent">HelpDesk Pro</span>
                    </div>
                </div>
                <div class="main-div">
                    <div class="first-div">
<!--                        <a-->
<!--                                th:href="@{/home/admin}"-->
<!--                                class="px-5 py-2.5 rounded-xl text-white font-semibold bg-slate-700 hover:bg-slate-600 border border-slate-600 flex items-center transition-all"-->
<!--                        >-->
<!--                            Dashboard-->
<!--                        </a>-->
                        <button th:onclick="|window.location.href='@{/incident/create}'|" class="px-6 py-3 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 text-white font-semibold rounded-xl flex items-center gap-2 shadow-lg hover:shadow-xl transition-all transform hover:scale-105">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                            </svg> New Ticket </button>
                    </div>
                    <div>
                        <a
                                th:href="@{/logout}"
                                class="px-6 py-3 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 text-white font-semibold rounded-xl flex items-center gap-2 shadow-lg hover:shadow-xl transition-all transform hover:scale-105"
                        >
                            <svg
                                    class="w-5 h-5"
                                    fill="none"
                                    stroke="currentColor"
                                    viewbox="0 0 24 24"
                            >
                                <path
                                        stroke-linecap="round"
                                        stroke-linejoin="round"
                                        stroke-width="2"
                                        d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"
                                />
                            </svg>
                            Logout
                        </a>
                    </div>
                </div>
<!--                <div class="flex items-center gap-4"><button th:onclick="|window.location.href='@{/incident/create}'|" class="px-6 py-3 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 text-white font-semibold rounded-xl flex items-center gap-2 shadow-lg hover:shadow-xl transition-all transform hover:scale-105">-->
<!--                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />-->
<!--                    </svg> New Ticket </button>-->
<!--                </div>-->
            </div>
        </div>
    </nav><!-- Hero Section -->
    <div class="relative overflow-hidden">
        <div class="absolute inset-0 bg-gradient-to-r from-indigo-600/20 via-purple-600/20 to-pink-600/20"></div>
        <div class="relative max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-16">
            <div class="text-center animate-slide-up">
                <h1 id="welcome-message" class="text-5xl md:text-6xl font-extrabold text-white mb-6 leading-tight">How can we help you today?</h1>
                <p class="text-xl text-indigo-200 mb-10 max-w-2xl mx-auto">Submit a ticket and our expert team will assist you promptly</p>
                <div class="flex flex-wrap justify-center gap-5"><a th:href="@{/incident/create}" class="group px-10 py-5 bg-white text-indigo-600 rounded-2xl font-bold shadow-2xl hover:shadow-indigo-500/50 transition-all transform hover:scale-105 flex items-center gap-3"> <span class="text-3xl">🎫</span> <span class="text-lg">Create New Ticket</span> </a>
                    <a th:href="@{/incident/viewByUser}" class="px-10 py-5 bg-white/10 backdrop-blur-sm text-white rounded-2xl font-bold border-2 border-white/30 hover:bg-white/20 transition-all flex items-center gap-3"> <span class="text-3xl">📋</span> <span class="text-lg">View My Tickets</span> </a>
                </div>
            </div>
        </div>
    </div><!-- Stats Dashboard -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 -mt-8 pb-12">
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
            <div class="bg-slate-800/50 backdrop-blur-xl rounded-3xl p-8 border border-slate-700/50 shadow-xl hover:shadow-2xl transition-all transform hover:scale-105 animate-slide-up">
                <div class="flex items-center justify-between mb-4">
                    <div class="w-16 h-16 bg-gradient-to-br from-blue-500 to-cyan-500 rounded-2xl flex items-center justify-center shadow-lg"><span class="text-3xl">📊</span>
                    </div>
                    <div class="text-right">
                        <p class="text-slate-400 text-sm font-medium">Total Tickets</p>
                        <p id="total-tickets" class="text-4xl font-bold text-white" th:text="${total}"></p>
                    </div>
                </div>
                <div class="h-1 bg-gradient-to-r from-blue-500 to-cyan-500 rounded-full"></div>
            </div>
            <div class="bg-slate-800/50 backdrop-blur-xl rounded-3xl p-8 border border-slate-700/50 shadow-xl hover:shadow-2xl transition-all transform hover:scale-105 animate-slide-up" style="animation-delay: 0.1s;">
                <div class="flex items-center justify-between mb-4">
                    <div class="w-16 h-16 bg-gradient-to-br from-yellow-500 to-orange-500 rounded-2xl flex items-center justify-center shadow-lg"><span class="text-3xl">⏳</span>
                    </div>
                    <div class="text-right">
                        <p class="text-slate-400 text-sm font-medium">Open</p>
                        <p id="open-tickets" class="text-4xl font-bold text-yellow-400" th:text="${open}"></p>
                    </div>
                </div>
                <div class="h-1 bg-gradient-to-r from-yellow-500 to-orange-500 rounded-full"></div>
            </div>
            <div class="bg-slate-800/50 backdrop-blur-xl rounded-3xl p-8 border border-slate-700/50 shadow-xl hover:shadow-2xl transition-all transform hover:scale-105 animate-slide-up" style="animation-delay: 0.2s;">
                <div class="flex items-center justify-between mb-4">
                    <div class="w-16 h-16 bg-gradient-to-br from-indigo-500 to-purple-500 rounded-2xl flex items-center justify-center shadow-lg"><span class="text-3xl">🔄</span>
                    </div>
                    <div class="text-right">
                        <p class="text-slate-400 text-sm font-medium">In Progress</p>
                        <p id="progress-tickets" class="text-4xl font-bold text-indigo-400" th:text="${inProgress}"></p>
                    </div>
                </div>
                <div class="h-1 bg-gradient-to-r from-indigo-500 to-purple-500 rounded-full"></div>
            </div>
            <div class="bg-slate-800/50 backdrop-blur-xl rounded-3xl p-8 border border-slate-700/50 shadow-xl hover:shadow-2xl transition-all transform hover:scale-105 animate-slide-up" style="animation-delay: 0.3s;">
                <div class="flex items-center justify-between mb-4">
                    <div class="w-16 h-16 bg-gradient-to-br from-green-500 to-emerald-500 rounded-2xl flex items-center justify-center shadow-lg"><span class="text-3xl">✅</span>
                    </div>
                    <div class="text-right">
                        <p class="text-slate-400 text-sm font-medium">Resolved</p>
                        <p id="resolved-tickets" class="text-4xl font-bold text-green-400" th:text="${resolved}"></p>
                    </div>
                </div>
                <div class="h-1 bg-gradient-to-r from-green-500 to-emerald-500 rounded-full"></div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
